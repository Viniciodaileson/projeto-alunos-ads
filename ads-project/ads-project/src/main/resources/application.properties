spring.application.name=ads-project
# Configura o H2 para salvar os dados em um arquivo no seu computador
spring.datasource.url=jdbc:h2:file:./data/adsprojectdb


# Credenciais de acesso padrão do banco
spring.datasource.username=sa
spring.datasource.password=

# Mantém a estrutura das tabelas atualizada sem apagar os dados antigos
spring.jpa.hibernate.ddl-auto=update

# Ativa o console visual do H2 no navegador (opcional para estudos)
spring.h2.console.enabled=true
